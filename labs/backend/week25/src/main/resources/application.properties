# 엔티티의 지연 로딩은 서비스(트랜잭션) 안에서만. 응답 DTO 변환도 서비스가 한다.
spring.jpa.open-in-view=false

# 세션 쿠키(JSESSIONID): 자바스크립트에서 못 읽게(HttpOnly), 다른 사이트에서 보낸 POST 에는 안 실리게(SameSite=Lax)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# OpenAPI 스펙의 응답 content 를 */* 대신 application/json 으로 (TS 타입 생성 때 키가 깔끔해진다)
springdoc.default-produces-media-type=application/json

# 데모 사용자. 비밀번호는 환경 변수 LIBRARY_DEMO_PASSWORD 로 바꿀 수 있다.
library.demo.username=demo
library.demo.password=demo1234
